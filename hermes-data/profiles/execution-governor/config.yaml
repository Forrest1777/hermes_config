model:
  default: openai/gpt-oss-20b
  provider: custom
  base_url: https://api.groq.com/openai/v1
  api_key: ${HERMES_CUSTOM_API_GROQ_COM_API_KEY}
  max_tokens: 128
fallback_model:
  provider: openai-codex
  model: gpt-5.6-terra
agent:
  max_turns: 3
  tool_use_enforcement: true
  reasoning_effort: low
  disabled_toolsets:
    - kanban
terminal:
  cwd: /opt/data/profiles/execution-governor
compression:
  enabled: false
memory:
  memory_enabled: false
  user_profile_enabled: false
_config_version: 41
custom_providers:
  - name: openai/gpt-oss-20b
    base_url: https://api.groq.com/openai/v1
    key_env: HERMES_CUSTOM_API_GROQ_COM_API_KEY
    model: openai/gpt-oss-20b
    models:
      openai/gpt-oss-20b:
        context_length: 131072
platform_toolsets:
  cli:
    - execution_governance
tools:
  tool_search:
    enabled: 'off'
plugins:
  enabled:
    - execution-governance
    - governance-guard
  disabled: []
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
    - execution_governance
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
