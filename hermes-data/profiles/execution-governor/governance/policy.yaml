schema_version: 1
timezone: America/Sao_Paulo
enabled: true
governed_profiles:
- implementation-orchestrator
- implementation-worker
- implementation-architect
- execution-governor
task_budget:
  default_max_total_attempts: 2
  hold_on_first_unexpected_failure: true
progress:
  compare_git_head: true
  compare_git_status: true
  human_required_when_no_material_progress: true
provider_circuit:
  terminal_error_types:
  - usage_limit_reached
  - insufficient_quota
  - billing_hard_limit_reached
  - usage_quota_exceeded
  - quota_exceeded
  require_human_reset: false
  retry_terminal_errors: true
  fallback_terminal_errors: false
provider_recovery:
  enabled: true
  retry_interval_minutes: 20
  max_automatic_retries: 12
  prefer_provider_reset_time: false
  authorization_ttl_minutes: 60
  one_probe_per_provider_per_dispatch_tick: true
# HERMES_DIRTY_CHECKPOINT_RECOVERY_V2_2026_09_04
dirty_checkpoint_recovery:
  event_driven: true
  catchup_scan_enabled: true
  catchup_scan_interval_seconds: 60
  catchup_max_tasks: 200
execution_governor_reconciliation:
  enabled: true
  stale_pending_case_ttl_hours: 24
  rebuild_when_governor_missing: true
  reopen_when_governor_done: true

kanban_actions:
  enforce_boards:
  - default
  mode: enforce
  hold_block_kind: needs_input
  governance_cards:
    auto_create: true
    auto_create_boards:
    - default
    assignee: execution-governor
    idempotency_prefix: execution-governance
    max_runtime_seconds: 300
    initial_status: ready
    auto_create_tenants: []
    max_retries: 1
  enforce_tenants: []
