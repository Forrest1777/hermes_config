name: worktree-guardian
version: 1.4.1
description: Atomic worktree provisioning from the root integration head, integrity verification, safe retry, conservative stale index.lock recovery, and post-root cleanup of locally integrated child worktrees.
provides_tools:
  - worktree_guardian_prepare
  - worktree_guardian_verify
  - worktree_guardian_recover_index_lock
